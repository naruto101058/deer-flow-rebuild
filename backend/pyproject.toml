[project]
name = "deer-flow-rebuild"
version = "0.1.0"
description = "A backend for the Deer Flow rebuild"
readme = "README.md"
authors = [
    { name = "sjj", email = "2691704660@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "deerflow-rebuild-harness",
    "fastapi==0.136.1",
    "uvicorn[standard]==0.46.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.0.3",
]

[tool.uv.workspace]
members = ["packages/harness"]
#
[tool.uv.sources]
deerflow-rebuild-harness = { workspace = true }
